[project]
name = "context-engineering-assistant"
version = "0.1.0"
description = "Multi-Agent Context Engineering Research Assistant"
authors = [{ name = "Anshul" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "pydantic>=2.0.0",
    "pymilvus>=2.4.0",
    "voyageai>=0.2.0",
    "google-generativeai>=0.7.0",
    "streamlit>=1.35.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pypdf>=4.2.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
